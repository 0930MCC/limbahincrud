    <!-- Default/fallback tags for the very first paint and for any crawler that doesn't execute

         mounts, for crawlers that DO run JS (Googlebot does). This is what search engines and
         social-share bots see before that happens. -->

         for EVERY route, so a canonical here told Google that every page without its own tag
         (login, portal, forms, 404s...) was a copy of the homepage ("Alternate page with proper
         canonical tag"). src/components/Seo.jsx sets the correct canonical/og:url per page. -->
    <meta name="robots" content="index, follow" />

      <p role="heading" aria-level="1" style="font-size:1.5em;font-weight:bold;">LIMBAHIN — Pengelolaan &amp; Pengangkutan Limbah B3 Jabodetabek</p>
      <p>
        LIMBAHIN, unit usaha PT Media Cahaya Cerah, menyediakan jasa pengelolaan dan pengangkutan
        limbah B3 (Bahan Berbahaya dan Beracun) yang berizin resmi dari Kementerian Lingkungan
        Hidup dan Kehutanan (KLHK). Kami melayani perusahaan, rumah sakit, klinik, hotel, dan
        fasilitas industri di seluruh wilayah Jabodetabek — Jakarta, Bogor, Depok, Tangerang,
        Bekasi, dan Cikarang — dengan kantor operasional yang berbasis langsung di Cikarang Pusat.
      </p>
      <p role="heading" aria-level="2" style="font-weight:bold;">Jenis Limbah yang Kami Kelola</p>
      <p>
        Layanan kami mencakup pengelolaan limbah medis (jarum suntik, APD, kassa terkontaminasi),
        limbah industri (oli bekas, solvent, bahan kimia proses), limbah komersial (baterai bekas,
        lampu TL, elektronik rusak), serta limbah produk dan bahan (barang reject, produk
        kedaluwarsa). Setiap jenis limbah ditangani sesuai karakteristiknya masing-masing, mulai
        dari pemilahan di sumber hingga pemusnahan akhir di fasilitas berizin.
      </p>
      <p role="heading" aria-level="2" style="font-weight:bold;">Manifest Elektronik dan Sertifikat Pemusnahan</p>
      <p>
        Setiap pengangkutan limbah B3 yang kami lakukan tercatat melalui Festronik, sistem manifest
        elektronik resmi KLHK, sehingga perusahaan Anda memiliki bukti kepatuhan hukum yang sah dan
        dapat diverifikasi kapan saja. Setelah limbah dimusnahkan, klien menerima Sertifikat
        Pemusnahan (Certificate of Destruction/CoD) sebagai dokumentasi akhir.
      </p>
      <p role="heading" aria-level="2" style="font-weight:bold;">Wilayah Layanan</p>
      <p>
        Kami melayani pengelolaan limbah B3 di Jakarta, Bekasi, Depok, Bogor, Tangerang, dan
        Cikarang, dengan waktu respons tercepat untuk kawasan industri di sekitar Cikarang.
      </p>
